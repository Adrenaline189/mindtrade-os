<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Checkout</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="app-shell wrap-narrow">
  <header class="topnav"><div class="brand">💳 Checkout</div><div class="topnav-links"><a class="pill" href="/profile">Profile</a></div></header>
  <div class='card'>
    <p>Email: <b>{{ email }}</b></p>
    <p>Plan: <b>{{ plan }}</b> | Amount: <b>{{ pricing.amount }} {{ pricing.currency }}</b></p>
    <form method='post' action='/checkout/create-order' class="stack">
      <input type='hidden' name='plan' value='{{ plan }}'>
      <label>Payment channel</label>
      <select name='channel'>{% for c in channels %}<option value='{{ c }}'>{{ c }}</option>{% endfor %}</select>
      <button type='submit'>Create order</button>
    </form>
  </div>
</div>
</body></html>
