<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1222" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/style.css" />
  <title>Login · MindTrade OS</title>
</head>
<body>
  <div class="app-shell">
    <div class="auth-card card">
      <div class="kicker">Welcome back</div>
      <h2 class="page-title">เข้าสู่ระบบ MindTrade OS</h2>
      {% if err %}<div class="bad error-note">Login failed</div>{% endif %}
      <form method="post" action="/auth/login" class="stack">
        <input name="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p class="small mt-sm">ยังไม่มีบัญชี? <a href="/auth/signup">สร้างบัญชีใหม่</a></p>
      <p class="small"><a href="/landing">← กลับหน้าแนะนำระบบ</a></p>
    </div>
  </div>
  {% include '_pwa.html' %}
</body>
</html>
