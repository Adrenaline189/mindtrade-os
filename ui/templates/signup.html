<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1222" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/style.css" />
  <title>Signup · MindTrade OS</title>
</head>
<body>
  <div class="wrap" style="max-width:520px;padding-top:28px">
    <div class="card">
      <h2 class="page-title">📝 Create account</h2>
      {% if err %}<div class="bad" style="margin:8px 0 12px">{{ err }}</div>{% endif %}
      <form method="post" action="/auth/signup" class="stack">
        <input name="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password (min 6)" required>
        <button type="submit">Sign up</button>
      </form>
      <p class="small" style="margin-top:10px"><a href="/auth/login">Have account? Login</a></p>
    </div>
  </div>
  {% include '_pwa.html' %}
</body>
</html>
